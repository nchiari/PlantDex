<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlantDex</title>
  <meta name="theme-color" content="#f7f2e3">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- Íconos grabados -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-emblem" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="32" cy="32" r="25.5" fill="none" stroke="currentColor" stroke-width=".8"/>
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M14 44c4 6 10 9 18 9M50 44c-4 6-10 9-18 9"/>
          <path d="M15 43c-1-3 0-6 2-7 1 3 0 6-2 7zM18 47c-2-2-2-5-1-7 2 2 2 5 1 7zM22 50c-2-1-3-4-2-6 2 1 3 4 2 6zM49 43c1-3 0-6-2-7-1 3 0 6 2 7zM46 47c2-2 2-5 1-7-2 2-2 5-1 7zM42 50c2-1 3-4 2-6-2 1-3 4-2 6z"/>
        </g>
        <path d="M32 48V20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M32 36c-9 0-12-7-12-12 7 0 12 4 12 12zM32 31c0-9 5-13 12-13 0 8-4 13-12 13z" fill="currentColor" opacity=".85"/>
        <path d="M32 36c-6-1-9-6-10-10M32 31c5-2 8-6 10-11" stroke="#f7f2e3" stroke-width=".7" fill="none"/>
        <circle cx="32" cy="17" r="3.2" fill="#b39a52" stroke="currentColor" stroke-width="1"/>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1z"/><path d="M21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z"/><path d="M6 9c1.5 0 2.5.3 3.5.8M6 12c1.5 0 2.5.3 3.5.8"/></g></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 6.5a5.5 5.5 0 1 0 3 9 6 6 0 0 1-3-9z"/><path d="M12 1.5v1.5M12 21v1.5M1.5 12H3M21 12h1.5"/></g></symbol>
      <symbol id="i-laurel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M7 20c-3-3-4-8-2-13M17 20c3-3 4-8 2-13"/><path d="M5.2 10c-1.6-.4-2.4-1.8-2.2-3 1.6.3 2.4 1.6 2.2 3zM5 14c-1.7.1-2.8-1-3-2.3 1.7-.1 2.8 1 3 2.3zM6.5 17.5c-1.6.6-3-.2-3.5-1.4 1.6-.6 3 .2 3.5 1.4zM18.8 10c1.6-.4 2.4-1.8 2.2-3-1.6.3-2.4 1.6-2.2 3zM19 14c1.7.1 2.8-1 3-2.3-1.7-.1-2.8 1-3 2.3zM17.5 17.5c1.6.6 3-.2 3.5-1.4-1.6-.6-3 .2-3.5 1.4z"/><path d="M12 6l1.3 2.7 3 .4-2.2 2 .6 3-2.7-1.5-2.7 1.5.6-3-2.2-2 3-.4z"/></g></symbol>
      <symbol id="i-quill" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3C12 4 7 9 5 19c3-5 6-7 10-8"/><path d="M20 3c0 6-3 11-9 12"/><path d="M4 21l2-3"/></g></symbol>
      <symbol id="i-seal" viewBox="0 0 80 80">
        <path d="M40 3c5 0 7 3 11 3s7-1 10 2 2 6 4 9 6 4 7 8-1 6 0 10 4 7 3 11-5 5-6 9 0 8-3 10-7 1-10 3-4 6-9 7-7-2-11-1-6 4-10 3-5-4-9-5-8 1-10-2-1-7-3-10-6-4-7-8 2-6 1-10-4-7-3-11 4-5 6-8 0-8 3-10 7-1 10-3 4-6 9-7z" fill="#3e5f34"/>
        <circle cx="40" cy="40" r="25" fill="none" stroke="#ffffff33" stroke-width="1.5"/>
        <circle cx="40" cy="40" r="21" fill="none" stroke="#00000033" stroke-width="1"/>
        <path d="M40 27v26M27 40h26" stroke="#00000030" stroke-width="4" stroke-linecap="round" transform="translate(.8 1)"/>
        <path d="M40 27v26M27 40h26" stroke="#f7f2e3" stroke-width="4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-vine" viewBox="0 0 240 20">
        <path d="M2 10h92M146 10h92" stroke="currentColor" stroke-width=".9"/>
        <path d="M100 10c6-8 14-8 20 0 6 8 14 8 20 0" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <path d="M108 6c-4-2-4-6-1-7 1 3 1 5 1 7zM132 14c4 2 4 6 1 7-1-3-1-5-1-7z" fill="currentColor"/>
        <circle cx="120" cy="10" r="2.2" fill="#b39a52"/>
        <path d="M70 10c-4-4-9-4-12-2 3 3 8 4 12 2zM170 10c4-4 9-4 12-2-3 3-8 4-12 2z" fill="currentColor" opacity=".7"/>
      </symbol>
    </defs>
    <filter id="engrave">
      <feColorMatrix type="saturate" values="0.55"/>
      <feComponentTransfer><feFuncR type="linear" slope="0.95" intercept="0.04"/><feFuncG type="linear" slope="0.98" intercept="0.05"/><feFuncB type="linear" slope="0.86" intercept="0.03"/></feComponentTransfer>
    </filter>
  </svg>

  <div class="book">
    <header class="top">
      <button id="btn-home" class="brand" aria-label="Inicio">
        <svg class="emblem"><use href="#i-emblem"/></svg>
        <span class="brand-text">
          <span class="wordmark">PlantDex</span>
          <span class="sub">Herbarium vivum</span>
        </span>
      </button>
      <button id="btn-settings" class="icon-btn" title="Ajustes"><svg><use href="#i-quill"/></svg></button>
    </header>

    <main id="app" class="page"></main>

    <nav class="bottom" id="nav" hidden>
      <button data-go="list"><svg><use href="#i-book"/></svg>Herbario</button>
      <button data-go="cal"><svg><use href="#i-moon"/></svg>Calendario</button>
      <button data-go="new" class="capture" title="Nueva lámina"><svg><use href="#i-seal"/></svg></button>
      <button data-go="stats"><svg><use href="#i-laurel"/></svg>Logros</button>
      <button data-go="settings"><svg><use href="#i-quill"/></svg>Ajustes</button>
    </nav>
  </div>

  <input type="file" id="file-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-input-gallery" accept="image/*" multiple hidden>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-box">
      <div class="sheet-title">Nueva lámina</div>
      <button class="btn primary" id="sh-cam">Sacar foto</button>
      <button class="btn" id="sh-gal">Elegir de la galería</button>
      <button class="btn ghost" id="sh-cancel">Cancelar</button>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script type="module" src="app.js?v=7"></script>
</body>
</html>
