# Mantiene despierto el proyecto gratuito de Supabase: si pasa 7 días sin actividad, Supabase lo pausa.
# Cada lunes hace una consulta liviana a la base. También se puede correr a mano desde la pestaña Actions.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 8 * * 1" # lunes, 08:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y SUPABASE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/plants?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase respondió HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase no respondió bien. Si el proyecto está pausado, restauralo desde el panel."
            exit 1
          fi
